# Forecast Meal API Worker. Deploy the static frontend separately through GitHub Pages.
name = "forecast-meal-api"
main = "src/index.js"
compatibility_date = "2026-11-08"

[ai]
binding = "AI"

[vars]
# CORS is a browser boundary, not authentication. The rate limiter also applies.
ALLOWED_ORIGINS = "https://kpao2020.github.io"

[[ratelimits]]
name = "MEAL_LIMITER"
namespace_id = "620621001"

  [ratelimits.simple]
  limit = 5
  period = 60
