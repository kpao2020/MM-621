# Forecast Meal API Worker. Deploy the static frontend separately through GitHub Pages.
name = "basket-buddy-api"
main = "src/index.js"
compatibility_date = "2026-11-08"

[ai]
binding = "AI"

[vars]
# CORS is a browser boundary, not authentication. Turnstile and rate limits also apply.
ALLOWED_ORIGINS = "https://kpao2020.github.io,http://localhost:5500,http://127.0.0.1:5500"
TURNSTILE_HOSTNAME = "kpao2020.github.io"

[[ratelimits]]
name = "MEAL_LIMITER"
namespace_id = "620621001"

  [ratelimits.simple]
  limit = 5
  period = 60
