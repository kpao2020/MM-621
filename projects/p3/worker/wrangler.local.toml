# Local development only. Production uses wrangler.toml and GitHub Pages CORS.
name = "forecast-meal-api-local"
main = "src/index.js"
compatibility_date = "2026-11-08"

[ai]
binding = "AI"
remote = true

[vars]
ALLOWED_ORIGINS = "http://localhost:5500,http://127.0.0.1:5500"
TURNSTILE_ENABLED = "false"

[[ratelimits]]
name = "MEAL_LIMITER"
namespace_id = "620621001"

  [ratelimits.simple]
  limit = 5
  period = 60
