name: Basket Buddy D1 Open Prices refresh

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Download and reconcile the full 50-mile snapshot
        required: false
        type: boolean
        default: false

concurrency:
  group: p3-open-prices-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      P3_FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and refresh the 50-mile D1 catalog
        run: python projects/p3/tools/refresh_open_prices.py "$RUNNER_TEMP/p3-open-prices"
